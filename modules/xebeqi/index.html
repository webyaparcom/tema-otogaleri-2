<script>
  (() => {
    const P = "modulex-sube-harita-liste";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const subeSec = (s, P) => {
        const dg = [...s.querySelectorAll("[data-sube]")];
        const pn = [...s.querySelectorAll("[data-sube-panel]")];
        if (!dg.length) return;
        s.classList.add(P + "--js");
        const sec = (n) => {
          dg.forEach((b) => {
            const on = b.dataset.sube === n;
            b.setAttribute("aria-pressed", String(on));
            const li = b.closest("li");
            if (li) li.classList.toggle(P + "--secili", on);
          });
          pn.forEach((p) => {
            const on = p.dataset.subePanel === n;
            p.classList.toggle(P + "--acik", on);
            const f = p.querySelector("iframe[data-src]");
            if (on && f && !f.getAttribute("src")) f.setAttribute("src", f.dataset.src);
          });
        };
        dg.forEach((b) => b.addEventListener("click", () => sec(b.dataset.sube)));
        sec(dg[0].dataset.sube);
        const konum = s.querySelector("[data-konum]");
        const liste = s.querySelector("[data-sube-liste]");
        const durum = s.querySelector("[data-konum-durum]");
        if (!konum || !liste || !navigator.geolocation) return;
        konum.hidden = false;
        const rad = (x) => (x * Math.PI) / 180;
        const km = (a, b, c, d) => {
          const h = Math.sin(rad(c - a) / 2) ** 2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(rad(d - b) / 2) ** 2;
          return 12742 * Math.asin(Math.min(1, Math.sqrt(h)));
        };
        let bic = null;
        try { bic = new Intl.NumberFormat(document.documentElement.lang || undefined, { style: "unit", unit: "kilometer", maximumFractionDigits: 1 }); } catch (e) { bic = null; }
        const bitti = () => { konum.disabled = false; konum.removeAttribute("aria-busy"); };
        konum.addEventListener("click", () => {
          konum.disabled = true;
          konum.setAttribute("aria-busy", "true");
          navigator.geolocation.getCurrentPosition((p) => {
            bitti();
            const la = p.coords.latitude;
            const lo = p.coords.longitude;
            const L = [...liste.children].map((li) => ({ li, d: "lat" in li.dataset ? km(la, lo, Number(li.dataset.lat), Number(li.dataset.lng)) : Infinity }));
            L.sort((a, b) => a.d - b.d);
            L.forEach((x) => {
              liste.append(x.li);
              const m = x.li.querySelector("[data-mesafe]");
              if (m) m.textContent = Number.isFinite(x.d) ? (bic ? bic.format(x.d) : x.d.toFixed(1)) : "";
            });
            const ilkB = L[0] && L[0].li.querySelector("[data-sube]");
            if (ilkB) sec(ilkB.dataset.sube);
            if (durum) durum.textContent = konum.dataset.tamam || "";
            s.classList.add(P + "--sirali");
          }, () => { bitti(); if (durum) durum.textContent = konum.dataset.red || ""; }, { timeout: 10000, maximumAge: 300000 });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      subeSec(s, P, az);
    });
  })();
</script>
