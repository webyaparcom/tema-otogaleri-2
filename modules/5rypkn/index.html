  @media (prefers-reduced-motion: reduce) {

  }
</style>
<script>
  (() => {
    const P = "modulex-acilis-katalog-arama";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const katalogCip = (s, P) => {
        s.querySelectorAll("form[data-katalog]").forEach((f) => {
          const a = f.querySelector("[data-liste]");
          const kok = f.dataset.katalog;
          if (!a || !kok) return;
          const gon = f.querySelector("[data-gonder]");
          const tem = f.querySelector("[data-temizle]");
          const ozet = f.querySelector("[data-secim]");
          const radyo = Array.from(f.querySelectorAll("input[type=radio]"));
          const son = {};
          const kes = kok.indexOf("#");
          const yol = kes === -1 ? kok : kok.slice(0, kes);
          const kare = kes === -1 ? "" : kok.slice(kes);
          const url = () => {
            const p = new URLSearchParams();
            radyo.filter((r) => r.checked).forEach((r) => p.append(r.name, r.value));
            const q = p.toString();
            return yol + (q ? (yol.indexOf("?") === -1 ? "?" : "&") + q : "") + kare;
          };
          const guncelle = () => {
            const sec = radyo.filter((r) => r.checked);
            a.href = url();
            if (ozet) ozet.textContent = sec.map((r) => r.dataset.metin || r.value).join(" · ");
            if (tem) tem.hidden = !sec.length;
            f.classList.toggle(P + "--secili", sec.length > 0);
            a.classList.remove(P + "--nabiz");
            void a.offsetWidth;
            if (sec.length) a.classList.add(P + "--nabiz");
          };
          radyo.forEach((r) => {
            if (r.checked) son[r.name] = r.value;
            r.addEventListener("click", () => {
              if (son[r.name] === r.value) { r.checked = false; son[r.name] = ""; } else son[r.name] = r.value;
              guncelle();
            });
          });
          if (tem) tem.addEventListener("click", () => {
            radyo.forEach((r) => { r.checked = false; });
            Object.keys(son).forEach((k) => { son[k] = ""; });
            guncelle();
            if (radyo[0]) radyo[0].focus();
          });
          f.addEventListener("submit", (e) => { e.preventDefault(); location.href = url(); });
          a.hidden = false;
          if (gon) gon.hidden = true;
          guncelle();
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      katalogCip(s, P, az);
    });
  })();
</script>
