<link
  href="https://fonts.googleapis.com/icon?family=Material+Icons"
  rel="stylesheet"
/>
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>

<footer class="modulex-footer-5">
  <div class="modulex-footer-5-container">
    <!-- Sol - Logo ve Hakkında -->
    <div class="modulex-footer-5-col modulex-footer-5-brand">
      <img
        src="/img/{{logo}}?v={{random}}"
        alt="{{web-name}} Logo"
        class="modulex-footer-5-logo"
      />
      <p class="modulex-footer-5-desc">{{description}}</p>
    </div>

    <!-- Orta - Linkler -->
    <div class="modulex-footer-5-col">
      <h4 class="modulex-footer-5-title">{{corporate-title}}</h4>
      <ul class="modulex-footer-5-list">
        {{corporate-links}}
      </ul>
    </div>

    <div class="modulex-footer-5-col">
      <h4 class="modulex-footer-5-title">{{categories-title}}</h4>
      <ul class="modulex-footer-5-list">
        {{category-links}}
      </ul>
    </div>

    <!-- Sağ - İletişim -->
    <div class="modulex-footer-5-col modulex-footer-5-contact">
      <h4 class="modulex-footer-5-title">{{contact-title}}</h4>
      <p class="modulex-footer-5-hours">{{working-hours}}</p>
      <div class="modulex-footer-5-contact-item">
        <span class="material-icons">call</span>
        <span>{{phone-number}}</span>
      </div>
      <div class="modulex-footer-5-contact-item">
        <span class="material-icons">email</span>
        <span>{{email-address}}</span>
      </div>
      <p class="modulex-footer-5-social-label">{{follow-us}}</p>
      <div class="modulex-footer-5-social">{{social-media-links}}</div>
    </div>
  </div>

  <!-- Alt Bilgi -->
  <div class="modulex-footer-5-bottom">
    <div class="modulex-footer-5-bottom-left">{{langbar}} {{copyright}}</div>
    <div class="modulex-footer-5-bottom-center">
      <span>{{jetkur-text}}</span>
    </div>
    <div class="modulex-footer-5-bottom-right">{{ssl-text}}</div>
  </div>
</footer>

<style>
  .modulex-footer-5 {
    background-color: --footer_bg--;
    color: --footer_text--;
    font-family: var(--mx-font-sans, Rubik, sans-serif);
    padding: 60px 24px 0 24px;
  }

  .modulex-footer-5-container {
    width: var(--max);
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 40px;
  }

  .modulex-footer-5-col {
    min-width: 0;
    overflow: hidden;
  }

  .modulex-footer-5-brand {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .modulex-footer-5-brand .modulex-footer-5-logo {
    max-width: 100%;
    height: auto;
    max-height: 80px;
    width: auto;
    object-fit: contain;
    margin-bottom: 20px;
  }

  /* SVG logo korumasi (2026-09-13, P5): intrinsic boyutu OLMAYAN bir SVG
     (yalniz viewBox) flex icinde 0'a coker ve logo GORUNMEZ. max-height
     yetmez -- ust sinirdir, olcu vermez. */
  .modulex-footer-5-brand .modulex-footer-5-logo[src*=".svg"] {
    height: 80px;
    width: auto;
  }

  .modulex-footer-5-brand .modulex-footer-5-desc {
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 20px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .modulex-footer-5-title {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 12px;
  }

  .modulex-footer-5-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .modulex-footer-5-list li {
    margin-bottom: 8px;
  }

  .modulex-footer-5-list a {
    text-decoration: none;
    color: inherit;
    font-size: 14px;
    transition: color 0.3s ease;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .modulex-footer-5-list a:hover {
    text-decoration: underline;
    color: --footer_link_hover--;
  }

  .modulex-footer-5-contact p {
    font-size: 14px;
    margin-bottom: 10px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .modulex-footer-5-contact-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 6px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .modulex-footer-5-contact-item .material-icons {
    font-size: 18px;
    color: inherit;
    flex-shrink: 0;
  }

  .modulex-footer-5-social-label {
    margin-top: 16px;
    margin-bottom: 6px;
    font-size: 14px;
  }

  .modulex-footer-5-social {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .modulex-footer-5-social a {
    display: flex;
    align-items: center;
    justify-content: center;
    background: --social_bg--;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    color: #FFFFFF;
    text-decoration: none;
    transition: background-color 0.3s ease, transform 0.3s ease;
    flex-shrink: 0;
  }

  .modulex-footer-5-social a:hover {
    background: --footer_bottom_bg--;
    transform: scale(1.1);
  }

  .modulex-footer-5-social svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .modulex-footer-5-bottom {
    width: var(--max);
    margin: 40px auto 0 auto;
    background-color: --footer_bottom_bg--;
    padding: 16px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    text-align: center;
    gap: 8px;
    color: #FFFFFF;
  }

  @media (min-width: 768px) {
    .modulex-footer-5-bottom {
      flex-direction: row;
      justify-content: space-between;
      text-align: left;
    }
  }

  @media (max-width: 768px) {
    .modulex-footer-5-container {
      grid-template-columns: 1fr;
      gap: 30px;
    }

    .modulex-footer-5 {
      padding: 40px 16px 0 16px;
    }

    .modulex-footer-5-brand .modulex-footer-5-logo {
      max-height: 60px;
    }
  }

  @media (max-width: 480px) {
    .modulex-footer-5 {
      padding: 30px 12px 0 12px;
    }

    .modulex-footer-5-container {
      gap: 20px;
    }

    .modulex-footer-5-brand .modulex-footer-5-logo {
      max-height: 50px;
    }

    .modulex-footer-5-social {
      gap: 8px;
    }

    .modulex-footer-5-social a {
      width: 32px;
      height: 32px;
    }

    .modulex-footer-5-social svg {
      width: 18px;
      height: 18px;
    }
  }

  /* W2: mobil tasma kontrolu */
  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  /* W2: erisilebilirlik — animasyon kapatma */
  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }

  /* Mobil uygulama kuralı (12 Kas 2026): dokunma hedefleri >= 48px (yalnız <=768px) */
  @media (max-width: 768px) {
    .modulex-footer-5-list a,
    .modulex-footer-5-bottom a,
    .modulex-footer-5-bottom .wm-langbar li a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      min-width: 48px;
    }

    .modulex-footer-5-social a {
      width: 48px;
      height: 48px;
    }

    .modulex-footer-5-contact-item a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
    }
  }
</style>
